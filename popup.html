<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Read Aloud GX</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Read Aloud GX</h1>
    <span id="status" class="status idle">Idle</span>
  </header>

  <section class="controls">
    <button id="readSel" class="primary">Read selection</button>
    <button id="readPage">Read page</button>
    <div class="row">
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <section class="settings">
    <label>Voice
      <select id="voice"><option value="">System default</option></select>
    </label>

    <label>Speed <output id="rateOut">1.0×</output>
      <input id="rate" type="range" min="0.5" max="2.5" step="0.1" value="1">
    </label>
    <label>Pitch <output id="pitchOut">1.0</output>
      <input id="pitch" type="range" min="0.5" max="2" step="0.1" value="1">
    </label>
    <label>Volume <output id="volumeOut">100%</output>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
    </label>

    <label class="check">
      <input id="showButton" type="checkbox" checked>
      Show “Read” button when I highlight text
    </label>

    <button id="test" class="ghost">Test this voice</button>
  </section>

  <footer>
    <div><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> read</div>
    <div><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> pause</div>
    <div><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> stop</div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
